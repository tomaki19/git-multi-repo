#
# Weekly version updates for the Rust dependencies (Cargo.toml, Cargo.lock)
# and the GitHub Actions used in .github/workflows. Minor and patch updates
# are grouped into one pull request per ecosystem; major updates get their
# own pull requests because they may need code changes.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
