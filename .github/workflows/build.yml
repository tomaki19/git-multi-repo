#
# Checks formatting and lints, runs the tests and builds release archives
# for Linux (statically linked musl, so it runs on any distro regardless of
# glibc version) and Windows plus a Debian package and a Windows MSI installer. Archives are uploaded as
# workflow artifacts and, for tags `v*`, published to a GitHub release.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: build (${{ matrix.target }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Determine package name
        id: meta
        shell: bash
        run: |
          pkgid="$(cargo pkgid)"
          version="${pkgid##*#}"
          version="${version##*@}"
          echo "package=git-multi-repo-$version-${{ matrix.target }}" >>"$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="${{ steps.meta.outputs.package }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/git-multi-repo" README.md LICENSE "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          (cd dist && sha256sum "$package.tar.gz" >"$package.tar.gz.sha256")

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Package Debian (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(cargo deb --locked --no-build --target ${{ matrix.target }})"
          cp "$deb" dist/
          (cd dist && sha256sum "$(basename "$deb")" >"$(basename "$deb").sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "${{ steps.meta.outputs.package }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/git-multi-repo.exe", README.md, LICENSE -Destination "dist/$package"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$package.zip").Hash.ToLower()
          Set-Content -NoNewline -Path "dist/$package.zip.sha256" -Value "$hash  $package.zip`n"

      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "${{ steps.meta.outputs.package }}"
          # MSI versions must be numeric: drop any pre-release or build suffix.
          $version = ("$(cargo pkgid)" -split '[#@]')[-1] -replace '[-+].*$', ''
          wix build wix/main.wxs -arch x64 `
            -d "Version=$version" `
            -d "RootDir=$PWD" `
            -d "BinDir=$PWD/target/${{ matrix.target }}/release" `
            -o "dist/$package.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$package.msi").Hash.ToLower()
          Set-Content -NoNewline -Path "dist/$package.msi.sha256" -Value "$hash  $package.msi`n"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.package }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist when it was created in the GitHub UI
          # (which also pushes the tag); then only attach the assets.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
