#
# Checks formatting and lints, runs the tests and builds release archives
# for Linux and Windows. Archives are uploaded as workflow artifacts and,
# for tags `v*`, published to a GitHub release.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: build (${{ matrix.target }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Determine package name
        id: meta
        shell: bash
        run: |
          pkgid="$(cargo pkgid)"
          version="${pkgid##*#}"
          version="${version##*@}"
          echo "package=git-multi-repo-$version-${{ matrix.target }}" >>"$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="${{ steps.meta.outputs.package }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/git-multi-repo" README.md LICENSE "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          (cd dist && sha256sum "$package.tar.gz" >"$package.tar.gz.sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "${{ steps.meta.outputs.package }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/git-multi-repo.exe", README.md, LICENSE -Destination "dist/$package"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$package.zip").Hash.ToLower()
          Set-Content -NoNewline -Path "dist/$package.zip.sha256" -Value "$hash  $package.zip`n"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
