[package]
name = "git-multi-repo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apply git commands and tasks to multiple git repositories"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
